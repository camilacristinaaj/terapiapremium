services:
  postgres:
    image: postgres:16-alpine
    container_name: terapiapremium-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: terapiapremium
      POSTGRES_PASSWORD: ${DB_PASSWORD:-troque-esta-senha}
      POSTGRES_DB: terapiapremium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terapiapremium"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terapiapremium-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
